<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#kisses {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: white;
    z-index: 0;
}

.kiss {
    position: absolute;
    user-select: none;
    pointer-events: none;
    filter: blur(2.5px);
    animation: flotar linear infinite;
}

@keyframes flotar {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -15px; }
}

#dificultades {
    position: fixed;
    top: 18px;
    left: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 2;
}

button {
    font-weight: bold;
    letter-spacing: 0.5px;
    border: 1px solid #222;
    background: rgba(255, 255, 255, 0.9);
    color: #222;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button.selected {
    background: #222;
    color: white;
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

#contador {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 2;
    padding: 11px 16px;
    border: 1px solid #222;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    color: #222;
    font-weight: bold;
    letter-spacing: 0.5px;
}

#quizz {
    position: fixed;
    left: 50%;
    top: 38%;
    transform: translate(-50%, -50%);
    min-width: 150px;
    padding: 16px 30px;
    font-size: 18px;
    z-index: 2;
}

#quizz:hover {
    transform: translate(-50%, -52%);
}

#panel {
    display: none;
    position: fixed;
    top: calc(38% + 65px);
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 560px);
    text-align: center;
    z-index: 2;
}

#pregunta {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: bold;
    color: #222;
    line-height: 1.4;
    margin-bottom: 18px;
    overflow-wrap: anywhere;
}

#respuesta {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    border: 1px solid #999;
    border-radius: 8px;
    outline: none;
    background: rgba(255, 255, 255, 0.95);
}

#respuesta:focus {
    border-color: #222;
}

#comprobar {
    margin-top: 12px;
}

#resultado {
    margin-top: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #222;
    min-height: 24px;
}

@media (max-width: 480px) {
    #dificultades {
        top: 12px;
        left: 12px;
        gap: 5px;
        max-width: 65%;
    }

    #dificultades button {
        padding: 9px 10px;
        font-size: 11px;
    }

    #contador {
        top: 12px;
        right: 12px;
        padding: 9px 10px;
        font-size: 12px;
    }

    #quizz {
        top: 38%;
    }

    #panel {
        top: calc(38% + 65px);
    }
}

#botonSecreto{position:fixed;right:22px;bottom:22px;z-index:5;width:54px;height:54px;padding:0;border:2px solid #b8860b;border-radius:50%;background:linear-gradient(145deg,#ffe58a,#d4a017);color:#5c3b00;font-size:25px;box-shadow:0 4px 18px rgba(184,134,11,.35)}
#botonSecreto:hover{transform:scale(1.08)}
#modalPassword{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35)}
#cajaPassword{width:min(90vw,360px);padding:28px 22px;border-radius:18px;background:#fffaf0;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2)}
#cajaPassword h2{margin:0 0 18px;color:#8a6410;font-size:20px}
#entradaPassword{width:100%;padding:12px;border:1px solid #c9a94d;border-radius:8px;font-size:17px;text-align:center}
#desbloquear{margin-top:12px;background:#d4a017;border-color:#a77b0b;color:white}
#cerrarPassword{margin-top:8px;border-color:#aaa}
#errorPassword{min-height:22px;margin-top:10px;color:#c62828;font-weight:bold}
.pantallaEspecial{display:none;position:fixed;inset:0;z-index:10;overflow:hidden;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at top,#fff7fa,#ffdce8 65%,#ffc6d9)}
#contenidoPropuesta{position:relative;z-index:2;width:min(92vw,650px)}
#contenidoPropuesta h1{margin:0 0 34px;color:#b42352;font-size:clamp(30px,6vw,54px);line-height:1.15}
#decoracionAmor{margin-bottom:22px;font-size:clamp(35px,8vw,66px);animation:latido 1.4s ease-in-out infinite}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
#botonesPropuesta{display:flex;justify-content:center;align-items:center;gap:24px;min-height:64px}
#botonSi{min-width:115px;border:0;background:#e83e70;color:white;font-size:19px;padding:15px 28px;box-shadow:0 5px 16px rgba(190,35,83,.25)}
#botonNo{min-width:105px;background:#777;color:white;border:0;position:fixed;z-index:12;transition:left .18s ease,top .18s ease,opacity .18s ease}
#pantallaFinal h1{color:#b42352;font-size:clamp(32px,7vw,58px)}
#pantallaFinal p{color:#8d3150;font-size:clamp(18px,4vw,25px)}
#volverInicio{margin-top:18px;background:white;border-color:#b42352;color:#b42352}
@media(max-width:480px){#botonSecreto{right:14px;bottom:14px;width:50px;height:50px}#botonesPropuesta{gap:12px}}

</style>
</head>

<body>

<div id="kisses"></div>

<div id="dificultades">
    <button type="button" data-dificultad="EASY">EASY</button>
    <button type="button" data-dificultad="HARD">HARD</button>
    <button type="button" data-dificultad="EXTREME">EXTREME</button>
</div>

<div id="contador">KISSES ❤️: <span id="totalKisses">0</span></div>

<button type="button" id="quizz">A JUGAR ISH ISH</button>

<div id="panel">
    <div id="pregunta"></div>

    <form id="formRespuesta">
        <input
            type="text"
            id="respuesta"
            placeholder="Escribe tu respuesta (solo texto)..."
            autocomplete="off"
            required
        >
        <button type="submit" id="comprobar">COMPROBAR</button>
    </form>

    <div id="resultado" aria-live="polite"></div>
</div>


<button type="button" id="botonSecreto" aria-label="Abrir acceso secreto" title="Secreto">🔒</button>
<div id="modalPassword">
  <div id="cajaPassword">
    <h2>INGRESA LA CONTRASEÑA</h2>
    <form id="formPassword">
      <input type="password" id="entradaPassword" placeholder="DD/MM/AA" autocomplete="off" required>
      <button type="submit" id="desbloquear">DESBLOQUEAR</button>
    </form>
    <div id="errorPassword" aria-live="polite"></div>
    <button type="button" id="cerrarPassword">CERRAR</button>
  </div>
</div>
<section id="pantallaPropuesta" class="pantallaEspecial">
  <div id="contenidoPropuesta">
    <div id="decoracionAmor">💗 💐 💗</div>
    <h1>¿Quieres ser mi novia?</h1>
    <div id="botonesPropuesta"><button type="button" id="botonSi">SÍ ❤️</button></div>
  </div>
  <button type="button" id="botonNo">NO</button>
</section>
<section id="pantallaFinal" class="pantallaEspecial">
  <div>
    <div style="font-size:clamp(48px,10vw,90px)">💖💖💖</div>
    <h1>¡SABÍA QUE DIRÍAS QUE SÍ!</h1>
    <p>Me haces muy feliz. Te quiero muchote Trini. ❤️</p>
    <button type="button" id="volverInicio">VOLVER AL INICIO</button>
  </div>
</section>

<script>

/* ACCESO SECRETO Y PROPUESTA */
const botonSecreto=document.getElementById("botonSecreto");
const modalPassword=document.getElementById("modalPassword");
const formPassword=document.getElementById("formPassword");
const entradaPassword=document.getElementById("entradaPassword");
const errorPassword=document.getElementById("errorPassword");
const pantallaPropuesta=document.getElementById("pantallaPropuesta");
const pantallaFinal=document.getElementById("pantallaFinal");
const botonNo=document.getElementById("botonNo");
const botonSi=document.getElementById("botonSi");

botonSecreto.addEventListener("click",()=>{
  modalPassword.style.display="flex";
  errorPassword.textContent="";
  entradaPassword.value="";
  entradaPassword.focus();
});
document.getElementById("cerrarPassword").addEventListener("click",()=>modalPassword.style.display="none");
modalPassword.addEventListener("click",event=>{if(event.target===modalPassword)modalPassword.style.display="none";});

formPassword.addEventListener("submit",event=>{
  event.preventDefault();
  if(entradaPassword.value.trim()==="28/11/26"){
    modalPassword.style.display="none";
    document.getElementById("dificultades").style.display="none";
    document.getElementById("contador").style.display="none";
    document.getElementById("quizz").style.display="none";
    document.getElementById("panel").style.display="none";
    botonSecreto.style.display="none";
    pantallaFinal.style.display="none";
    pantallaPropuesta.style.display="flex";
    moverBotonNo();
  }else{
    errorPassword.textContent="Contraseña incorrecta. Inténtalo otra vez.";
    entradaPassword.select();
  }
});

function moverBotonNo(){
  const margen=12,ancho=botonNo.offsetWidth||105,alto=botonNo.offsetHeight||45;
  const maxX=Math.max(margen,window.innerWidth-ancho-margen);
  const maxY=Math.max(margen,window.innerHeight-alto-margen);
  botonNo.style.left=(margen+Math.random()*(maxX-margen))+"px";
  botonNo.style.top=(margen+Math.random()*(maxY-margen))+"px";
  botonNo.style.opacity=Math.random()>.22?"1":"0.18";
}
["mouseenter","pointerdown","touchstart","click"].forEach(eventName=>{
  botonNo.addEventListener(eventName,event=>{
    if(eventName!=="click")event.preventDefault();
    moverBotonNo();
  },{passive:false});
});
window.addEventListener("resize",()=>{if(pantallaPropuesta.style.display==="flex")moverBotonNo();});
botonSi.addEventListener("click",()=>{
  pantallaPropuesta.style.display="none";
  pantallaFinal.style.display="flex";
});
document.getElementById("volverInicio").addEventListener("click",()=>{
  pantallaFinal.style.display="none";
  document.getElementById("dificultades").style.display="flex";
  document.getElementById("contador").style.display="block";
  document.getElementById("quizz").style.display="block";
  botonSecreto.style.display="block";
});

/* PERSONALIZA AQUÍ TUS PREGUNTAS Y RESPUESTAS */
const preguntas = {
    EASY: [
        {
            pregunta: "¿Cuál es mi color favorito?",
            respuesta: "verde"
        },
        {
            pregunta: "¿Cuál es mi comida favorita?",
            respuesta: ["hamburguesas", "hamburguesa"]
        },
        {
            pregunta: "¿Como te digo de cariño?",
            respuesta: "trini"
        },
         {
            pregunta: "¿Cómo se llama mi Artista Favorito?",
            respuesta: "YSY A"
        },
        {
            pregunta: "¿Cuánto peso levanto máximo en bench press (kg)?",
            respuesta: ["100kg", "100 kg", "100", "cien"]
        },
          {
            pregunta: "¿Nombre de mi cereal favorito?",
            respuesta: "Lucky Charms"
        }
    ],

    HARD: [
        {
            pregunta: "¿Que comiste antes de nuestro primer beso?",
            respuesta: "brownie"
        },
        {
            pregunta: "¿Que te regale en el dia de las madres?",
            respuesta: "flores"
        },
        {
            pregunta: "¿Cual es mi sabor de Arizona Favorito?",
            respuesta: "mango"
        },
        {
        pregunta: "¿Cómo se llama mi videojuego favorito?",
            respuesta: "geometry dash"
        },
        {
        pregunta: "¿Cuál es mi superhéroe favorito?",
            respuesta: "spiderman"
        },
        {
        pregunta: "¿Cómo se llamaba la pizza que pedimos en Ochento´s Pizza?",
           respuesta: ["triple ochentos", "triple ochento´s"]
        },
         {
        pregunta: "¿Cuál era el nombre de la novia de Ted Mosby que era pastelera?",
            respuesta: "victoria"
        }
    ],

    EXTREME: [
        {
            pregunta: "¿De que color era la camiseta que llevaba el dia que me corte con la palmera?",
            respuesta: "azul"
        },
        {
            pregunta: "¿Que hicimos en el gym la vez que fui contigo al smartfit?",
            respuesta: ["pierna", "besarnos", "cuadricep", "cuadri"]
        },
        {
            pregunta: "¿Que es lo que mas me gusta de tu carita hermosa?",
            respuesta: ["mis ojos", "ojos", "tus ojos", "todo"]
        },
        {
            pregunta: "¿Nombre de mi pelicula favorita sobre el viaje en el tiempo?",
            respuesta: "proyecto almanaque"
        },
        {
            pregunta: "¿Que tanto te quiero? (pista: No es un numero como tal)",
            respuesta: "Infinito"
        }
    ]
};

/* GUARDAR Y RECUPERAR PROGRESO */
const CLAVE_PROGRESO = "quizzKissesProgresoV1";

function cargarProgreso() {
    try {
        const guardado = localStorage.getItem(CLAVE_PROGRESO);

        if (guardado) {
            const datos = JSON.parse(guardado);

            return {
                total: Number.isSafeInteger(datos.total) && datos.total >= 0
                    ? datos.total
                    : 0,
                contestadas: {
                    EASY: Array.isArray(datos.contestadas?.EASY)
                        ? datos.contestadas.EASY
                        : [],
                    HARD: Array.isArray(datos.contestadas?.HARD)
                        ? datos.contestadas.HARD
                        : [],
                    EXTREME: Array.isArray(datos.contestadas?.EXTREME)
                        ? datos.contestadas.EXTREME
                        : []
                }
            };
        }
    } catch (error) {
        console.warn("No se pudo cargar el progreso guardado.", error);
    }

    return {
        total: 0,
        contestadas: {
            EASY: [],
            HARD: [],
            EXTREME: []
        }
    };
}

const progreso = cargarProgreso();

const contestadas = {
    EASY: new Set(progreso.contestadas.EASY),
    HARD: new Set(progreso.contestadas.HARD),
    EXTREME: new Set(progreso.contestadas.EXTREME)
};

let totalKisses = progreso.total;

function guardarProgreso() {
    try {
        localStorage.setItem(CLAVE_PROGRESO, JSON.stringify({
            total: totalKisses,
            contestadas: {
                EASY: [...contestadas.EASY],
                HARD: [...contestadas.HARD],
                EXTREME: [...contestadas.EXTREME]
            }
        }));
    } catch (error) {
        console.warn("No se pudo guardar el progreso.", error);
    }
}

function actualizarContador() {
    document.getElementById("totalKisses").textContent = totalKisses;
}

actualizarContador();

/* CREAR LOS BESOS DEL FONDO */
const kisses = document.getElementById("kisses");

for (let i = 0; i < 40; i++) {
    const kiss = document.createElement("div");

    kiss.className = "kiss";
    kiss.textContent = "💋";
    kiss.style.left = Math.random() * 100 + "%";
    kiss.style.top = Math.random() * 100 + "%";
    kiss.style.fontSize = (25 + Math.random() * 45) + "px";
    kiss.style.opacity = 0.25 + Math.random() * 0.35;
    kiss.style.transform =
        `rotate(${Math.random() * 60 - 30}deg)`;
    kiss.style.animationDuration =
        (4 + Math.random() * 6) + "s";
    kiss.style.animationDelay =
        (Math.random() * 5) + "s";

    kisses.appendChild(kiss);
}

/* ELEMENTOS Y ESTADO */
let dificultadSeleccionada = null;
let preguntaActual = null;
let indiceActual = null;

const mensajePregunta = document.getElementById("pregunta");
const panel = document.getElementById("panel");
const campoRespuesta = document.getElementById("respuesta");
const resultado = document.getElementById("resultado");
const formulario = document.getElementById("formRespuesta");
const botonComprobar = document.getElementById("comprobar");

const botonesDificultad =
    document.querySelectorAll("[data-dificultad]");

/* SELECCIONAR UNA SOLA DIFICULTAD */
botonesDificultad.forEach(boton => {
    boton.addEventListener("click", () => {
        dificultadSeleccionada = boton.dataset.dificultad;

        botonesDificultad.forEach(otro => {
            const seleccionado = otro === boton;

            otro.classList.toggle("selected", seleccionado);
            otro.setAttribute(
                "aria-pressed",
                seleccionado ? "true" : "false"
            );
        });

        preguntaActual = null;
        indiceActual = null;
        panel.style.display = "none";
        campoRespuesta.value = "";
        campoRespuesta.disabled = false;
        botonComprobar.disabled = false;
        resultado.textContent = "";
    });
});

/* MOSTRAR UNA PREGUNTA ALEATORIA NO CONTESTADA */
document.getElementById("quizz").addEventListener("click", () => {
    campoRespuesta.disabled = false;
    botonComprobar.disabled = false;

    if (!dificultadSeleccionada) {
        preguntaActual = null;
        indiceActual = null;
        panel.style.display = "block";
        mensajePregunta.textContent = "ELIGE UNA DIFICULTAD";
        formulario.style.display = "none";
        resultado.textContent = "";
        return;
    }

    const lista = preguntas[dificultadSeleccionada];

const disponibles = lista
    .map((item, indice) => ({ ...item, indice }))
    .filter(item => {
        const respuestas = Array.isArray(item.respuesta)
            ? item.respuesta
            : [item.respuesta];

        return (
            item.pregunta.trim() !== "" &&
            respuestas.some(respuesta =>
                typeof respuesta === "string" &&
                respuesta.trim() !== ""
            ) &&
            !contestadas[dificultadSeleccionada].has(item.indice)
        );
    });


    if (disponibles.length === 0) {
        preguntaActual = null;
        indiceActual = null;
        panel.style.display = "block";
        mensajePregunta.textContent =
            `¡Completaste todas las preguntas de ${dificultadSeleccionada}! ❤️`;
        formulario.style.display = "none";
        resultado.textContent = "";
        return;
    }

    const elegida =
        disponibles[Math.floor(Math.random() * disponibles.length)];

    preguntaActual = elegida;
    indiceActual = elegida.indice;

    mensajePregunta.textContent = preguntaActual.pregunta;
    panel.style.display = "block";
    formulario.style.display = "block";
    campoRespuesta.value = "";
    resultado.textContent = "";
    campoRespuesta.focus();
});

/* COMPROBAR RESPUESTA Y ACTUALIZAR CONTADOR */
formulario.addEventListener("submit", event => {
    event.preventDefault();

    if (!preguntaActual || indiceActual === null) return;

   const respuestaUsuario = campoRespuesta.value
    .trim()
    .toLocaleLowerCase();

const respuestasCorrectas = Array.isArray(preguntaActual.respuesta)
    ? preguntaActual.respuesta
    : [preguntaActual.respuesta];

const esCorrecta = respuestasCorrectas.some(respuesta =>
    respuesta.trim().toLocaleLowerCase() === respuestaUsuario
);

if (esCorrecta) {
    const yaContestada =
        contestadas[dificultadSeleccionada].has(indiceActual);

    if (!yaContestada) {
        contestadas[dificultadSeleccionada].add(indiceActual);
        totalKisses++;

        actualizarContador();
        guardarProgreso();
    }

    resultado.textContent = "¡CORRECTO TRIIINIII! ❤️ +1 KISS";
    resultado.style.color = "#16803c";

    campoRespuesta.disabled = true;
    botonComprobar.disabled = true;
} else {
    resultado.textContent =
        "Muek. Inténtalo de nuevo.";
    resultado.style.color = "#c62828";
}
});
</script>

</body>
</html>
