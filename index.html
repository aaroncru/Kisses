<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
    }

    #kisses {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: white;
    }

    .kiss {
        position: absolute;
        user-select: none;
        pointer-events: none;
        filter: blur(2.5px);
        animation: flotar linear infinite;
    }

    @keyframes flotar {
        0% {
            translate: 0 0;
        }
        50% {
            translate: 0 -15px;
        }
        100% {
            translate: 0 0;
        }
    }
</style>
</head>

<body>

<div id="kisses"></div>

<script>
    const kisses = document.getElementById("kisses");

    for (let i = 0; i < 40; i++) {
        const kiss = document.createElement("div");

        kiss.className = "kiss";
        kiss.textContent = "💋";
        kiss.style.left = Math.random() * 100 + "%";
        kiss.style.top = Math.random() * 100 + "%";
        kiss.style.fontSize = (25 + Math.random() * 45) + "px";
        kiss.style.opacity = 0.25 + Math.random() * 0.35;
        kiss.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
        kiss.style.animationDuration = (4 + Math.random() * 6) + "s";
        kiss.style.animationDelay = (Math.random() * 5) + "s";

        kisses.appendChild(kiss);
    }
</script>

</body>
</html>
