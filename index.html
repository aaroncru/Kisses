<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kisses</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: white;
        font-family: Arial, sans-serif;
    }

    body {
        position: relative;
    }

    #kisses {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: 1;
    }

    .kiss {
        position: absolute;
        user-select: none;
        pointer-events: none;
        filter: blur(2.5px);
        opacity: 0.25;
        animation: flotar linear infinite;
    }

    @keyframes flotar {
        0% {
            transform: translateY(0) rotate(0deg);
        }

        50% {
            transform: translateY(-15px) rotate(8deg);
        }

        100% {
            transform: translateY(0) rotate(0deg);
        }
    }

    #contador {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 24px;
        font-weight: bold;
        color: #d60000;
        letter-spacing: 2px;
    }

    #contenedorBoton {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
    }

    #boton {
        border: none;
        background: #e60000;
        color: white;
        font-size: 24px;
        font-weight: bold;
        padding: 18px 45px;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s, background 0.2s;
    }

    #boton:hover {
        background: #c00000;
        transform: scale(1.05);
    }

    #boton:active {
        transform: scale(0.95);
    }

    #fotoContainer {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        padding: 80px 20px 40px;
    }

    #fotoContainer.show {
        opacity: 1;
    }

    #foto {
        max-width: 70vw;
        max-height: 70vh;
        object-fit: contain;
        border-radius: 15px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 600px) {
        #contador {
            font-size: 20px;
            top: 15px;
        }

        #boton {
            font-size: 20px;
            padding: 15px 35px;
        }

        #foto {
            max-width: 85vw;
            max-height: 70vh;
        }
    }
</style>
</head>

<body>

<div id="kisses"></div>

<div id="contador">24:00:00</div>

<div id="fotoContainer">
    <img id="foto" src="" alt="">
</div>

<div id="contenedorBoton">
    <button id="boton">Kisses</button>
</div>

<script>
    const fotos = [
        "1 (2).png",
        "2 (2).jpeg",
        "3 (2).jpeg",
        "4.jpeg",
        "5.jpeg",
        "6.jpeg",
        "7.jpeg"
    ];

    const fechaInicio = new Date("2026-10-04T00:00:00");

    const kisses = document.getElementById("kisses");
    const boton = document.getElementById("boton");
    const foto = document.getElementById("foto");
    const fotoContainer = document.getElementById("fotoContainer");
    const contador = document.getElementById("contador");
    const contenedorBoton = document.getElementById("contenedorBoton");

    for (let i = 0; i < 40; i++) {
        const kiss = document.createElement("div");

        kiss.className = "kiss";
        kiss.textContent = "💋";

        kiss.style.left = Math.random() * 100 + "%";
        kiss.style.top = Math.random() * 100 + "%";
        kiss.style.fontSize = (25 + Math.random() * 45) + "px";
        kiss.style.opacity = 0.25 + Math.random() * 0.35;
        kiss.style.transform = `rotate(${Math.random() * 60 - 30}deg)`;
        kiss.style.animationDuration = (4 + Math.random() * 6) + "s";
        kiss.style.animationDelay = (Math.random() * 5) + "s";

        kisses.appendChild(kiss);
    }

    function obtenerDiaActual() {
        const ahora = new Date();

        const hoy = new Date(
            ahora.getFullYear(),
            ahora.getMonth(),
            ahora.getDate()
        );

        const inicio = new Date(
            fechaInicio.getFullYear(),
            fechaInicio.getMonth(),
            fechaInicio.getDate()
        );

        return Math.floor((hoy - inicio) / 86400000);
    }

    function obtenerFotoDelDia() {
        const dia = obtenerDiaActual();

        if (dia < 0 || dia >= fotos.length) {
            return null;
        }

        return fotos[dia];
    }

    boton.addEventListener("click", function() {
        const fotoDelDia = obtenerFotoDelDia();

        if (fotoDelDia) {
            foto.src = fotoDelDia;
            fotoContainer.classList.add("show");
            contenedorBoton.style.zIndex = "5";
        }
    });

    function actualizarContador() {
        const ahora = new Date();

        const siguienteDia = new Date(
            ahora.getFullYear(),
            ahora.getMonth(),
            ahora.getDate() + 1,
            0,
            0,
            0
        );

        const diferencia = siguienteDia - ahora;

        let horas = Math.floor(diferencia / 3600000);
        let minutos = Math.floor((diferencia % 3600000) / 60000);
        let segundos = Math.floor((diferencia % 60000) / 1000);

        horas = String(horas).padStart(2, "0");
        minutos = String(minutos).padStart(2, "0");
        segundos = String(segundos).padStart(2, "0");

        contador.textContent = `${horas}:${minutos}:${segundos}`;

        if (
            horas === "00" &&
            minutos === "00" &&
            segundos === "00"
        ) {
            actualizarFotoDelNuevoDia();
            contenedorBoton.style.zIndex = "30";
        }
    }

    function actualizarFotoDelNuevoDia() {
        fotoContainer.classList.remove("show");
        foto.src = "";
    }

    actualizarContador();

    setInterval(actualizarContador, 1000);
</script>

</body>
</html>
