
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: Arial, sans-serif;
}

#kisses {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: white;
    z-index: 0;
}

.kiss {
    position: absolute;
    user-select: none;
    pointer-events: none;
    filter: blur(2.5px);
    animation: flotar linear infinite;
}

@keyframes flotar {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -15px; }
}

#dificultades {
    position: fixed;
    top: 18px;
    left: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 2;
}

button {
    font-weight: bold;
    letter-spacing: 0.5px;
    border: 1px solid #222;
    background: rgba(255, 255, 255, 0.9);
    color: #222;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button.selected {
    background: #222;
    color: white;
}

#quizz {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    min-width: 150px;
    padding: 16px 30px;
    font-size: 18px;
    z-index: 2;
}

#quizz:hover {
    transform: translate(-50%, -52%);
}

#zonaPregunta {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translateX(-50%);
    width: min(90vw, 600px);
    text-align: center;
    z-index: 2;
}

#pregunta {
    font-size: clamp(18px, 3vw, 27px);
    font-weight: bold;
    color: #222;
    line-height: 1.4;
    margin-bottom: 18px;
    white-space: pre-wrap;
}

#respuesta {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 8px;
    outline: none;
    background: rgba(255, 255, 255, 0.95);
}

#respuesta:focus {
    border-color: #222;
}

#comprobar {
    margin-top: 12px;
}

#resultado {
    margin-top: 14px;
    font-size: 17px;
    font-weight: bold;
    line-height: 1.4;
}

.correcta {
    color: #00FF33;
}

.incorrecta {
    color: #FF0000;
}

.oculto {
    display: none;
}

@media (max-width: 480px) {
    #dificultades {
        top: 12px;
        left: 12px;
        gap: 5px;
    }

    #dificultades button {
        padding: 9px 10px;
        font-size: 11px;
    }

    #quizz {
        top: 35%;
    }

    #zonaPregunta {
        top: 45%;
    }
}
</style>
</head>

<body>

<div id="kisses"></div>

<div id="dificultades">
    <button type="button" data-dificultad="EASY">EASY</button>
    <button type="button" data-dificultad="HARD">HARD</button>
    <button type="button" data-dificultad="EXTREME">EXTREME</button>
</div>

<button type="button" id="quizz">ISH ISH A JUGAR</button>

<div id="zonaPregunta">
    <div id="pregunta"></div>

    <div id="zonaRespuesta" class="oculto">
        <input
            type="text"
            id="respuesta"
            placeholder="Escribe tu respuesta (solo texto)..."
            autocomplete="off"
        >

        <br>

        <button type="button" id="comprobar">COMPROBAR</button>

        <div id="resultado" aria-live="polite"></div>
    </div>
</div>

<script>

/* PERSONALIZA AQUÍ TUS PREGUNTAS Y RESPUESTAS */

const preguntas = {
    EASY: [
        {
            pregunta: "¿Cuál es mi color favorito?",
            respuesta: "verde"
        },
        {
            pregunta: "¿Cuál es mi comida favorita?",
            respuesta: "hamburgesas"
        },
        {
            pregunta: "¿Cuantos medios hermanos tengo?",
            respuesta: "dos"
        },
        {
            pregunta: "¿Que apodo te digo?",
            respuesta: "Trini"
        }
    ],

    HARD: [
        {
            pregunta: "¿Donde fue nuestra primera salida a comer?",
            respuesta: "Sabrozon"
        },
        {
            pregunta: "¿Que te regale por el dia de las madres?",
            respuesta: "flores"
        },
        {
            pregunta: "¿Qué comiste antes de nuestro primer beso?",
            respuesta: "brownie"
        }
    ],

    EXTREME: [
        {
            pregunta: "¿De que color era la camiseta que llevaba el dia que me corte con la palmera?",
            respuesta: "azul"
        },
        {
            pregunta: "¿Cual es mi sabor de Arizona favorito?",
            respuesta: "mango"
        },
        {
            pregunta: "¿En que ciudad de Alaska me la pase el verano 2025?",
            respuesta: "Anchorage"
        }
    ]
};

/* CREAR LOS BESOS DEL FONDO */

const kisses = document.getElementById("kisses");

for (let i = 0; i < 40; i++) {
    const kiss = document.createElement("div");

    kiss.className = "kiss";
    kiss.textContent = "💋";
    kiss.style.left = Math.random() * 100 + "%";
    kiss.style.top = Math.random() * 100 + "%";
    kiss.style.fontSize = (25 + Math.random() * 45) + "px";
    kiss.style.opacity = 0.25 + Math.random() * 0.35;
    kiss.style.transform =
        `rotate(${Math.random() * 60 - 30}deg)`;
    kiss.style.animationDuration =
        (4 + Math.random() * 6) + "s";
    kiss.style.animationDelay =
        (Math.random() * 5) + "s";

    kisses.appendChild(kiss);
}

/* ELEMENTOS Y ESTADO */

let dificultadSeleccionada = null;
let preguntaActual = null;

const elementoPregunta = document.getElementById("pregunta");
const zonaRespuesta = document.getElementById("zonaRespuesta");
const campoRespuesta = document.getElementById("respuesta");
const resultado = document.getElementById("resultado");

const botonesDificultad =
    document.querySelectorAll("[data-dificultad]");

/* SELECCIONAR UNA SOLA DIFICULTAD */

botonesDificultad.forEach(boton => {
    boton.addEventListener("click", () => {
        dificultadSeleccionada = boton.dataset.dificultad;

        botonesDificultad.forEach(otro => {
            const seleccionado = otro === boton;

            otro.classList.toggle("selected", seleccionado);
            otro.setAttribute(
                "aria-pressed",
                seleccionado ? "true" : "false"
            );
        });

        preguntaActual = null;
        elementoPregunta.textContent = "";
        zonaRespuesta.classList.add("oculto");
        campoRespuesta.value = "";
        resultado.textContent = "";
        resultado.className = "";
    });
});

/* MOSTRAR UNA PREGUNTA ALEATORIA */

document.getElementById("quizz").addEventListener("click", () => {
    if (!dificultadSeleccionada) {
        elementoPregunta.textContent = "ELIGE UNA DIFICULTAD";
        zonaRespuesta.classList.add("oculto");
        return;
    }

    const lista = preguntas[dificultadSeleccionada].filter(item =>
        item.pregunta.trim() !== "" &&
        item.respuesta.trim() !== ""
    );

    if (lista.length === 0) {
        elementoPregunta.textContent =
            `Agrega preguntas y respuestas para ${dificultadSeleccionada}.`;
        zonaRespuesta.classList.add("oculto");
        return;
    }

    const indiceAleatorio = Math.floor(Math.random() * lista.length);
    preguntaActual = lista[indiceAleatorio];

    elementoPregunta.textContent = preguntaActual.pregunta;
    zonaRespuesta.classList.remove("oculto");

    campoRespuesta.value = "";
    resultado.textContent = "";
    resultado.className = "";

    campoRespuesta.focus();
});

/* COMPROBAR LA RESPUESTA */

function comprobarRespuesta() {
    if (!preguntaActual) return;

    const respuestaUsuario = campoRespuesta.value.trim().toLocaleLowerCase();
    const respuestaCorrecta = preguntaActual.respuesta.trim().toLocaleLowerCase();

    if (respuestaUsuario === "") {
        resultado.textContent = "ESCRIBE UNA RESPUESTA";
        resultado.className = "incorrecta";
        return;
    }

    if (respuestaUsuario === respuestaCorrecta) {
        resultado.textContent = "¡RESPUESTA CORRECTA TRINI! ❤️";
        resultado.className = "correcta";
    } else {
        resultado.textContent = "MUEK, INTENTA OTRA VEZ";
        resultado.className = "incorrecta";
    }
}

document.getElementById("comprobar").addEventListener("click", comprobarRespuesta);

campoRespuesta.addEventListener("keydown", evento => {
    if (evento.key === "Enter") {
        comprobarRespuesta();
    }
});

</script>

</body>
</html>
