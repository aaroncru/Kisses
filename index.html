```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💋</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

#kissBackground {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.kiss {
    position: absolute;
    line-height: 1;
    user-select: none;
    pointer-events: none;
    filter: blur(2.5px);
    animation: floating ease-in-out infinite;
}

@keyframes floating {

    0% {
        margin-top: 0;
    }

    50% {
        margin-top: -10px;
    }

    100% {
        margin-top: 0;
    }

}

.button-container {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    z-index: 10;
}

.kisses-button {
    border: none;

    background: #e60023;
    color: white;

    font-size: 24px;
    font-weight: bold;

    padding: 18px 55px;

    border-radius: 50px;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.18);

    transition:
        transform 0.25s ease,
        background 0.25s ease;
}

.kisses-button:hover {
    background: #c9001f;

    transform: scale(1.08);
}

.kisses-button:active {
    transform: scale(0.96);
}

.photo-container {
    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    z-index: 20;

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.3s ease;
}

.photo-container.show {
    opacity: 1;
}

.random-photo {
    max-width: 70vw;
    max-height: 70vh;

    width: auto;
    height: auto;

    object-fit: contain;

    border-radius: 15px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.25);
}

@media (max-width: 600px) {

    .kiss {
        filter: blur(2px);
    }

    .kisses-button {
        font-size: 21px;

        padding:
            16px 45px;
    }

    .random-photo {
        max-width: 85vw;
        max-height: 70vh;
    }

}

</style>
</head>

<body>

<div id="kissBackground"></div>

<div class="button-container">

    <button
        class="kisses-button"
        id="kissesButton">
        Kisses
    </button>

</div>

<div
    class="photo-container"
    id="photoContainer">

    <img
        class="random-photo"
        id="randomPhoto"
        src=""
        alt="">

</div>

<script>

const background =
    document.getElementById("kissBackground");

const kissesButton =
    document.getElementById("kissesButton");

const photoContainer =
    document.getElementById("photoContainer");

const randomPhoto =
    document.getElementById("randomPhoto");


const cantidadBesos = 40;


for (let i = 0; i < cantidadBesos; i++) {

    const kiss =
        document.createElement("div");

    kiss.textContent = "💋";

    kiss.className = "kiss";

    const x =
        Math.random() * 100;

    const y =
        Math.random() * 100;

    const size =
        35 + Math.random() * 80;

    const rotation =
        -45 + Math.random() * 90;

    const opacity =
        0.25 + Math.random() * 0.35;

    const duration =
        3 + Math.random() * 4;

    const delay =
        Math.random() * 4;

    kiss.style.left =
        x + "%";

    kiss.style.top =
        y + "%";

    kiss.style.fontSize =
        size + "px";

    kiss.style.opacity =
        opacity;

    kiss.style.transform =
        `translate(-50%, -50%) rotate(${rotation}deg)`;

    kiss.style.animationDuration =
        duration + "s";

    kiss.style.animationDelay =
        delay + "s";

    background.appendChild(kiss);

}


/* FOTOS */

const fotos = [

    "1.jpeg",
    "2.jpeg",
    "3.jpeg",
    "4.jpeg",
    "5.jpeg",
    "6.jpeg",
    "7.jpeg",
    "9.jpeg",
    "10.jpeg",
    "11.jpeg",
    "12.jpeg",
    "13.jpeg",
    "14.jpeg",
    "15.jpeg",
    "16.jpeg",
    "17.jpeg",
    "18.jpeg",
    "19.jpeg",
    "20.jpeg",
    "21.jpeg",
    "22.jpeg",
    "23.jpeg",
    "24.jpeg",
    "25.jpeg",
    "26.jpeg",
    "27.jpeg",
    "28.jpeg",
    "29.jpeg",
    "30.jpeg",
    "31.jpeg",
    "32.jpeg",
    "33.jpeg",
    "34.jpeg",
    "35.jpeg",
    "36.jpeg",
    "37.jpeg",
    "38.jpeg",
    "39.jpeg"

];


/* MOSTRAR FOTO */

kissesButton.addEventListener("click", function() {

    const indiceAleatorio =
        Math.floor(
            Math.random() * fotos.length
        );

    randomPhoto.src =
        fotos[indiceAleatorio];

    photoContainer.classList.add("show");

});

</script>

</body>
</html>
